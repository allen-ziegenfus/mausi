# mausi: kitty settings. Load them with one line in kitty.conf, pointing at
# your checkout:
#
#     geninclude ~/mausi/kitty/mausi.py
#
# mausi.py prints this file plus the Alt-g key, which needs the absolute path
# of picker.py. (A plain `include .../mausi.conf` works too, without Alt-g.)
#
# Anything here can be overridden by setting it again in kitty.conf after
# that line. Restart kitty after adding it (listen_on is only read at startup).

# Remote control: mausi, mausi-mark, mausi-hook and the dashboard drive kitty
# over this socket. {kitty_pid} gives each kitty instance its own socket.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# macOS: let the left Option key act as Alt, so the Alt-keys below work.
macos_option_as_alt left

# Splits first so new tabs can take side-by-side splits; stack = zoom one pane.
enabled_layouts splits,stack
map alt+z toggle_layout stack

# Tab numbers in the tab bar: Alt-<n> below and the dashboard's 1–9 keys go
# by them. {title} is what mausi-mark puts ⏳ in front of.
tab_title_template "{index}: {title}"

# Alt-<n> switches tabs; tab 1 is the mausi dashboard.
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10
